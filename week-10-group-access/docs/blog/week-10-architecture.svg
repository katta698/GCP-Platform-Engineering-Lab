<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img"><title>A service account holding no roles directly is a member of a Cloud Identity group, and that group holds logging.viewer on the platform folder, so the account can read logs only while the membership exists.</title><metadata id="panels">ci:40,130,230,160;gc:310,96,610,260;fold:610,150,286,170</metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5F6368" stroke-width="1.4"/></marker></defs><rect width="960" height="500" fill="#FFFFFF"/><text x="40" y="40" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#5F6368" letter-spacing="0.6">GCP PLATFORM ENGINEERING LAB · WEEK 10</text><text x="40" y="66" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#202124">Group-based access: the role belongs to the group</text><text x="40" y="88" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5F6368">Access appears and disappears with membership, and nothing else changes</text><rect x="40" y="130" width="230" height="160" rx="8" fill="#FFFFFF" stroke="#C6CBD1" stroke-width="1" stroke-dasharray="6 4"/><text x="56" y="157" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">Cloud Identity</text><g transform="translate(133.0,184.0) scale(1.8333)"><defs><style>.i1cls-1{fill:#669df6;}.i1cls-1,.i1cls-2{fill-rule:evenodd;}.i1cls-2{fill:#4285f4;}</style></defs><title>Icon_24px_IAM_Color</title><g data-name="Product Icons"><g ><path class="i1cls-1" d="M12,2,3.79,5.42v5.63c0,5.06,3.5,9.8,8.21,11,4.71-1.15,8.21-5.89,8.21-10.95V5.42Zm0,3.79a2.63,2.63,0,1,1-1.86.77A2.63,2.63,0,0,1,12,5.79Zm4.11,11.15A8.64,8.64,0,0,1,12,19.87a8.64,8.64,0,0,1-4.11-2.93V14.69c0-1.67,2.74-2.52,4.11-2.52s4.11.85,4.11,2.52v2.25Z"/><path class="i1cls-2" d="M12,2V5.79a2.63,2.63,0,1,1,0,5.26v1.12c1.37,0,4.11.85,4.11,2.52v2.25A8.64,8.64,0,0,1,12,19.87V22c4.71-1.15,8.21-5.89,8.21-10.95V5.42Z"/></g></g></g><text x="155" y="248" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">an access group</text><text x="155" y="265" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">holds the role</text><rect x="310" y="96" width="610" height="260" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="326" y="123" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">Google Cloud</text><g transform="translate(418.0,184.0) scale(1.8333)"><defs><style>.i2cls-1{fill:#669df6;}.i2cls-1,.i2cls-2{fill-rule:evenodd;}.i2cls-2{fill:#4285f4;}</style></defs><title>Icon_24px_IAM_Color</title><g data-name="Product Icons"><g ><path class="i2cls-1" d="M12,2,3.79,5.42v5.63c0,5.06,3.5,9.8,8.21,11,4.71-1.15,8.21-5.89,8.21-10.95V5.42Zm0,3.79a2.63,2.63,0,1,1-1.86.77A2.63,2.63,0,0,1,12,5.79Zm4.11,11.15A8.64,8.64,0,0,1,12,19.87a8.64,8.64,0,0,1-4.11-2.93V14.69c0-1.67,2.74-2.52,4.11-2.52s4.11.85,4.11,2.52v2.25Z"/><path class="i2cls-2" d="M12,2V5.79a2.63,2.63,0,1,1,0,5.26v1.12c1.37,0,4.11.85,4.11,2.52v2.25A8.64,8.64,0,0,1,12,19.87V22c4.71-1.15,8.21-5.89,8.21-10.95V5.42Z"/></g></g></g><text x="440" y="248" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">service account</text><text x="440" y="265" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">holds nothing</text><rect x="610" y="150" width="286" height="170" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/><text x="626" y="177" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">platform folder</text><g transform="translate(731.0,204.0) scale(1.8333)"><defs><style>.i3cls-1{fill:#4285f4;}.i3cls-2{fill:none;}.i3cls-3{fill:#669df6;}.i3cls-4{fill:#aecbfa;}</style></defs><title>Icon_24px_Logging_Color</title><g data-name="Product Icons"><rect class="i3cls-1" x="6" y="11" width="4" height="2"/><rect class="i3cls-1" x="4" y="18" width="6" height="2"/><g data-name="colored-32/logs"><rect class="i3cls-2" width="24" height="24"/><g ><polygon id="Fill-3" class="i3cls-1" points="4 18 6 18 6 6 4 6 4 18"/><polygon id="Fill-4" class="i3cls-3" points="9 7 22 7 22 3 9 3 9 7"/><polygon id="Fill-4-2" data-name="Fill-4" class="i3cls-3" points="9 14 22 14 22 10 9 10 9 14"/><polygon id="Fill-4-3" data-name="Fill-4" class="i3cls-3" points="9 21 22 21 22 17 9 17 9 21"/><polygon id="Fill-7" class="i3cls-4" points="2 8 8 8 8 2 2 2 2 8"/></g></g></g></g><text x="753" y="268" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">logs</text><text x="753" y="285" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">logging.viewer</text><path d="M418,206 L177,206" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="298" cy="206" r="10" fill="#1A73E8"/><text x="298" y="210" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><path d="M177,206 L610,206" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="394" cy="206" r="10" fill="#1A73E8"/><text x="394" y="210" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text x="40" y="402" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">1   The service account holds no role of its own. Every permission it has is a consequence of being a member.</text><text x="40" y="421" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">2   The role is bound to the GROUP, at the folder. Removing the member removes the access, with no IAM edit</text><text x="40" y="440" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">     and no Terraform run. Groups are parented to a customer, not an organization - searching by org returns zero.</text></svg>