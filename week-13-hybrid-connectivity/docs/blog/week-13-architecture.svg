<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="A hub VPC and a branch VPC joined by two HA VPN tunnels. A Cloud Router on each side runs BGP over the tunnels on different ASNs, so each VPC learns the other's subnet rather than being told it. When one tunnel drops, BGP withdraws the routes learned through it in about three seconds and the surviving tunnel carries the traffic."><defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
  </filter>
  <filter id="smudge"><feGaussianBlur stdDeviation="9"/></filter>
  <marker id="nib" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10"
          markerHeight="10" orient="auto-start-reverse">
    <path d="M1.5,1.5 L10.5,6 L1.5,10.5" fill="none" stroke="#f1eee4"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .hand { font-family: Caveat, 'Segoe Script', cursive; fill: #f1eee4; }
    .h1 { font-size: 44px; } .h2 { font-size: 30px; }
    .b { font-size: 23px; fill: #c3cbc0; } .s { font-size: 20px; fill: #c3cbc0; }
  </style>
</defs>
