<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img"><title>Two VPC networks inside Google Cloud, each with an HA VPN gateway and a Cloud Router on its own BGP ASN. Two IPsec tunnels join the gateways. Each router advertises its own subnet and installs what the other advertises, so neither side is configured with a static route. When one tunnel drops the routes learned through it are withdrawn in about three seconds and the surviving tunnel carries the traffic.</title><metadata id="panels">gc:40,96,880,250;hub:64,140,392,186;br:504,140,392,186</metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5F6368" stroke-width="1.4"/></marker></defs><rect width="960" height="490" fill="#FFFFFF"/><text x="40" y="40" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#5F6368" letter-spacing="0.6">GCP PLATFORM ENGINEERING LAB · WEEK 13</text><text x="40" y="66" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#202124">Hybrid connectivity with HA VPN and BGP</text><text x="40" y="88" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5F6368">Two networks, two tunnels, and routing the two sides negotiate between themselves</text><rect x="40" y="96" width="880" height="250" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="56" y="123" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">Google Cloud</text><rect x="64" y="140" width="392" height="186" rx="8" fill="#F1F3F4" stroke="#C6CBD1" stroke-width="1"/><text x="80" y="167" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">hub VPC — 10.20.0.0/24</text><rect x="504" y="140" width="392" height="186" rx="8" fill="#F1F3F4" stroke="#C6CBD1" stroke-width="1"/><text x="520" y="167" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">branch VPC — 10.30.0.0/24</text><g transform="translate(128.0,190.0) scale(1.8333)"><defs><style>.i1cls-1{fill:#4285f4;}</style></defs><title>Icon_24px_Router_Color</title><g data-name="Product Icons"><g ><g ><g data-name=" 24 router"><path class="i1cls-1" d="M19,14v3l-5-5,5-5v3h3v4ZM5,10H2v4H5v3l5-5L5,7Zm9,7V14H10v3H7l5,5,5-5ZM14,7v3H10V7H7l5-5,5,5Z"/></g></g></g></g></g><text x="150" y="254" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">Cloud Router</text><text x="150" y="271" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">ASN 64512</text><g transform="translate(348.0,190.0) scale(1.8333)"><defs><style>.i2cls-1{fill:#669df6;}.i2cls-2{fill:#4285f4;}</style></defs><title>Icon_24px_VPN-01_Color</title><g data-name="Product Icons"><g ><rect class="i2cls-1" x="14.73" y="11.28" width="4.18" height="1.38"/><rect class="i2cls-1" x="17.95" y="6.12" width="1.38" height="11.71"/><rect class="i2cls-2" x="16.3" y="17.32" width="4.68" height="4.68" rx="0.28"/><rect class="i2cls-2" x="16.3" y="2" width="4.68" height="4.68" rx="0.28"/><rect class="i2cls-1" x="6.98" y="11.28" width="4.28" height="1.38"/><rect class="i2cls-2" x="3.03" y="9.63" width="4.68" height="4.68" rx="0.28"/><path class="i2cls-2" d="M13,14.17a2.2,2.2,0,1,1,2.2-2.2A2.19,2.19,0,0,1,13,14.17Zm0-3.57A1.38,1.38,0,1,0,14.33,12,1.37,1.37,0,0,0,13,10.6Z"/></g></g