<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><title>A Cloud KMS key encrypting a Secret Manager secret that carries a one-hour rotation schedule. When the schedule fires it publishes a SECRET_ROTATE message to Pub/Sub and does nothing else; a Cloud Run function subscribed to that topic is what actually adds a new secret version.</title><metadata id="panels">gc:40,96,880,230</metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5F6368" stroke-width="1.4"/></marker></defs><rect width="960" height="470" fill="#FFFFFF"/><text x="40" y="40" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#5F6368" letter-spacing="0.6">GCP PLATFORM ENGINEERING LAB · WEEK 12</text><text x="40" y="66" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#202124">Secret management: two things called rotation</text><text x="40" y="88" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5F6368">One of them creates new material; the other publishes a message</text><rect x="40" y="96" width="880" height="230" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="56" y="123" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">Google Cloud — security project</text><g transform="translate(128.0,178.0) scale(1.8333)"><defs><style>.i1cls-1{fill:#669df6;}.i1cls-1,.i1cls-2{fill-rule:evenodd;}.i1cls-2{fill:#4285f4;}</style></defs><title>Icon_24px_KeyManageService_Color</title><g data-name="Product Icons"><path class="i1cls-1" d="M11.32,17.06H10v1.4h1.37v.63h1.43V12.18a3.47,3.47,0,0,0,2.67-