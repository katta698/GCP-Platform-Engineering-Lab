<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740" role="img" aria-label="A service account holding no roles requests a grant against a Privileged Access Manager entitlement on the platform folder. A human approver, a different principal, approves. PAM writes a temporary role binding into the folder IAM policy and removes it about thirteen seconds after the thirty minute grant expires."><defs>
