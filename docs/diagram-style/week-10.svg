<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="A service account that holds no roles of its own is a member of a group. The group holds roles/logging.viewer on the platform folder. The folder contains the logging project, so the service account can read its logs only for as long as the membership exists."><defs>
