<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="A module produces a project inside a folder, carrying labels, an environment tag from a closed set, essential contacts and no default network. Separately a custom organization policy constraint evaluates project creation against the project id prefix and parent, in dry run."><defs>
