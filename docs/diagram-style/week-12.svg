<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="A Cloud KMS key encrypts a Secret Manager secret. The key rotates itself on a schedule, creating a new key version with no code involved. The secret's own rotation schedule only publishes a message to a Pub/Sub topic; a Cloud Functions rotator subscribed to that topic is what actually adds a new secret version. Without the function the secret never changes."><defs>
