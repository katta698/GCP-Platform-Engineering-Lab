    <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
  </filter>
  <filter id="smudge"><feGaussianBlur stdDeviation="9"/></filter>
  <marker id="nib" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10"
          markerHeight="10" orient="auto-start-reverse">
    <path d="M1.5,1.5 L10.5,6 L1.5,10.5" fill="none" stroke="#f1eee4"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .hand { font-family: Caveat, 'Segoe Script', cursive; fill: #f1eee4; }
    .h1 { font-size: 44px; } .h2 { font-size: 30px; }
    .b { font-size: 23px; fill: #c3cbc0; } .s { font-size: 20px; fill: #c3cbc0; }
  </style>
</defs>
