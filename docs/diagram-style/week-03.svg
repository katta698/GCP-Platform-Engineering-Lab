<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="Four policies are set at the organization in dry run: three managed Compute constraints and one custom bucket-label constraint. The workloads/dev folder carries a deliberate exception that disables the serial port constraint. Violations are logged to the project audit log, not the organization's."><defs>
