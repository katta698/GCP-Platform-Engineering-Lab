<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img"><title>A probe VM with no external IP inside a subnet, reaching Google APIs two ways. One goes to a Private Service Connect endpoint on an address reserved inside the VPC but deliberately outside any subnet range. The other goes up through the VPC's default internet gateway to Google's own public addresses, which is what Private Google Access does. Deleting the default route breaks the second path and leaves the first working.</title><metadata id="panels">gc:40,96,880,330;vpc:64,140,560,270;sub:90,250,230,130</metadata><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5F6368" stroke-width="1.4"/></marker></defs><rect width="960" height="580" fill="#FFFFFF"/><text x="40" y="40" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" fill="#5F6368" letter-spacing="0.6">GCP PLATFORM ENGINEERING LAB · WEEK 14</text><text x="40" y="66" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="600" fill="#202124">Private access to Google APIs, with no route to the internet</text><text x="40" y="88" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#5F6368">One workload, two paths out — and only one of them survives losing the gateway</text><rect x="40" y="96" width="880" height="330" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><text x="56" y="123" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">Google Cloud</text><rect x="64" y="140" width="560" height="270" rx="8" fill="#F1F3F4" stroke="#C6CBD1" stroke-width="1"/><text x="80" y="167" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">psc-lab VPC</text><rect x="90" y="250" width="230" height="130" rx="8" fill="#FFFFFF" stroke="#C6CBD1" stroke-width="1" stroke-dasharray="6 4"/><text x="106" y="277" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#5F6368" text-anchor="start">subnet</text><g transform="translate(178.0,288.0) scale(1.8333)"><defs><style>.i1cls-1{fill:#aecbfa;}.i1cls-2{fill:#669df6;}.i1cls-3{fill:#4285f4;}</style></defs><title>Icon_24px_ComputeEngine_Color</title><g data-name="Product Icons"><rect class="i1cls-1" x="9" y="9" width="6" height="6"/><rect class="i1cls-2" x="11" y="2" width="2" height="4"/><rect class="i1cls-2" x="7" y="2" width="2" height="4"/><rect class="i1cls-2" x="15" y="2" width="2" height="4"/><rect class="i1cls-3" x="11" y="18" width="2" height="4"/><rect class="i1cls-3" x="7" y="18" width="2" height="4"/><rect class="i1cls-3" x="15" y="18" width="2" height="4"/><rect class="i1cls-3" x="19" y="10" width="2" height="4" transform="translate(8 32) rotate(-90)"/><rect class="i1cls-3" x="19" y="14" width="2" height="4" transform="translate(4 36) rotate(-90)"/><rect class="i1cls-3" x="19" y="6" width="2" height="4" transform="translate(12 28) rotate(-90)"/><rect class="i1cls-2" x="3" y="10" width="2" height="4" transform="translate(-8 16) rotate(-90)"/><rect class="i1cls-2" x="3" y="14" width="2" height="4" transform="translate(-12 20) rotate(-90)"/><rect class="i1cls-2" x="3" y="6" width="2" height="4" transform="translate(-4 12) rotate(-90)"/><path class="i1cls-1" d="M5,5V19H19V5ZM17,17H7V7H17Z"/><polygon class="i1cls-2" points="9 15 15 15 12 12 9 15"/><polygon class="i1cls-3" points="12 12 15 15 15 9 12 12"/></g></g><text x="200" y="352" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">probe VM</text><text x="200" y="369" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">10.40.0.x, no external IP</text><g transform="translate(448.0,288.0) scale(1.8333)"><defs><style>.i2cls-1{fill:#669df6;fill-rule:evenodd;}.i2cls-2{fill:#4285f4;}.i2cls-3{fill:#aecbfa;}</style></defs><title>Icon_24px_Network_Color</title><g data-name="Product Icons"><g ><polygon class="i2cls-1" points="4.94 13.7 11.53 20.22 12.62 19.07 6.3 12.93 4.94 13.7"/><polygon class="i2cls-1" points="12.57 4.06 11.48 5.22 17.69 11.44 19.47 11.06 12.57 4.06"/><rect class="i2cls-2" x="11.38" y="5.13" width="1.25" height="5"/><rect class="i2cls-2" x="11.38" y="14.5" width="1.25" height="5"/><circle id="Oval" class="i2cls-3" cx="12" cy="4.5" r="1.88"/><circle class="i2cls-3" cx="12" cy="19.5" r="1.88"/><polygon class="i2cls-1" points="2.66 11.38 17.73 11.38 21.37 13.25 6.3 13.25 2.66 11.38"/><circle class="i2cls-3" cx="4.5" cy="12.31" r="2.5"/><circle class="i2cls-3" cx="19.5" cy="12.31" r="2.5"/></g></g></g><text x="470" y="352" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">PSC endpoint</text><text x="470" y="369" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">10.99.0.2</text><g transform="translate(448.0,163.0) scale(1.8333)"><defs><style>.i3cls-1{fill:#4285f4;}.i3cls-2{fill:#669df6;}</style></defs><title>Icon_24px_CloudNAT_Color</title><g data-name="Product Icons"><path class="i3cls-1" d="M15.3,11.17c0,.27,0,.54,0,.83s0,.56,0,.83h4.5V11.17Z"/><path class="i3cls-1" d="M9.86,5.89H7V7.56h3.93A10,10,0,0,0,9.86,5.89Z"/><path class="i3cls-1" d="M11,16.44H7.6v1.67H9.89A10.7,10.7,0,0,0,11,16.44Z"/><path class="i3cls-1" d="M12,12a7.45,7.45,0,0,0,0-.83H4.5v1.66H12A7.45,7.45,0,0,0,12,12Z"/><path class="i3cls-2" d="M3.67,12.48A.48.48,0,1,1,4.14,12,.48.48,0,0,1,3.67,12.48Zm0-2.15A1.67,1.67,0,1,0,5.33,12,1.67,1.67,0,0,0,3.67,10.33Z"/><path class="i3cls-2" d="M6.17,17.75a.48.48,0,1,1,.47-.48A.47.47,0,0,1,6.17,17.75Zm0-2.14a1.67,1.67,0,1,0,1.66,1.66A1.67,1.67,0,0,0,6.17,15.61Z"/><path class="i3cls-2" d="M6.17,7.2a.48.48,0,1,1,.47-.47A.47.47,0,0,1,6.17,7.2Zm0-2.14a1.67,1.67,0,1,0,0,3.33,1.67,1.67,0,0,0,0-3.33Z"/><polygon class="i3cls-1" points="18.67 14.5 18.67 9.5 22 12 18.67 14.5"/><path class="i3cls-1" d="M9.5,22l-.86-1.5A10.73,10.73,0,0,0,12.83,12a10.89,10.89,0,0,0-4.2-8.5L9.5,2a12.53,12.53,0,0,1,5,10A12.46,12.46,0,0,1,9.5,22Z"/></g></g><text x="470" y="227" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">internet gateway</text><text x="470" y="244" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">the default route</text><g transform="translate(778.0,288.0) scale(1.8333)"><defs><style>.i4cls-1{fill:#4285f4;}.i4cls-2{fill:#669df6;}.i4cls-3{fill:#aecbfa;}</style></defs><title>Icon_24px_CloudAPIs_Color</title><g data-name="Product Icons"><path class="i4cls-1" d="M16.49,12,12,16.49,7.51,12,12,7.51ZM12,14.91,14.91,12,12,9.09,9.09,12Z"/><polygon class="i4cls-2" points="16.33 15.02 18.98 15.02 22 12 19.35 12 16.33 15.02"/><polygon class="i4cls-3" points="16.33 8.98 19.35 12 22 12 18.98 8.98 16.33 8.98"/><polygon class="i4cls-3" points="7.67 8.98 5.02 8.98 2 12 4.65 12 7.67 8.98"/><polygon class="i4cls-2" points="2 12 5.02 15.02 7.67 15.02 4.65 12 2 12"/><polygon class="i4cls-3" points="8.98 5.02 8.98 7.67 12 4.65 12 2 8.98 5.02"/><polygon class="i4cls-2" points="12 2 12 4.65 15.02 7.67 15.02 5.02 12 2"/><polygon class="i4cls-3" points="8.98 16.33 8.98 18.98 12 22 12 19.35 8.98 16.33"/><polygon class="i4cls-2" points="12 19.35 12 22 15.02 18.98 15.02 16.33 12 19.35"/></g></g><text x="800" y="352" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">Google APIs</text><text x="800" y="369" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">storage.googleapis.com</text><path d="M222,310 L448,310" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="335" cy="310" r="10" fill="#1A73E8"/><text x="335" y="314" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><path d="M492,310 L778,310" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="635" cy="310" r="10" fill="#1A73E8"/><text x="635" y="314" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><path d="M200,288 L200,185 L448,185" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="324" cy="185" r="10" fill="#1A73E8"/><text x="324" y="189" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text><path d="M492,185 L800,185 L800,288" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="646" cy="185" r="10" fill="#1A73E8"/><text x="646" y="189" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text><text x="40" y="472" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">1-2 Private Service Connect. The VM talks to 10.99.0.2, an address reserved inside this VPC. Google requires it to</text><text x="40" y="491" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">     sit OUTSIDE every subnet range, which is why it is not part of 10.40.0.0/24.</text><text x="40" y="510" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">3-4 Private Google Access. The VM talks to Google's OWN addresses, 199.36.153.8/30, out through the default route.</text><text x="40" y="529" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">Delete that route and 3-4 stops. 1-2 never used it. That is the entire difference, and it is testable in one command.</text></svg>