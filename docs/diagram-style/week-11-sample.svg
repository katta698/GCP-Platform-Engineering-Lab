<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="A service account that holds no roles requests a grant against a Privileged Access Manager entitlement on the platform folder. A human approver, who is a different principal, approves. PAM writes a temporary role binding into the folder IAM policy and removes it about thirteen seconds after the thirty minute grant expires, at which point the original permission denial returns.">
