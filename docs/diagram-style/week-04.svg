<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="A host project owns a custom-mode VPC with two subnets. A service project in the workloads folder attaches to it, and its virtual machine draws an address from the host's dev subnet with no external IP. A hierarchical firewall policy attached to the workloads folder allows IAP ingress on port 22."><defs>
