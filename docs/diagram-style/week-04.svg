" transform="translate(12 28) rotate(-90)"/><rect class="i3cls-2" x="3" y="10" width="2" height="4" transform="translate(-8 16) rotate(-90)"/><rect class="i3cls-2" x="3" y="14" width="2" height="4" transform="translate(-12 20) rotate(-90)"/><rect class="i3cls-2" x="3" y="6" width="2" height="4" transform="translate(-4 12) rotate(-90)"/><path class="i3cls-1" d="M5,5V19H19V5ZM17,17H7V7H17Z"/><polygon class="i3cls-2" points="9 15 15 15 12 12 9 15"/><polygon class="i3cls-3" points="12 12 15 15 15 9 12 12"/></g></g><text x="716" y="272" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#202124" text-anchor="middle">e2-micro</text><text x="716" y="289" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="middle">no external IP</text><path d="M488,248 L540,248" fill="none" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="514" cy="248" r="10" fill="#1A73E8"/><text x="514" y="252" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="40" y="420" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">1   The service project is attached to the host's Shared VPC. The workload gets addressing it does not own and</text><text x="40" y="439" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">     cannot change, and the firewall policy sits on the FOLDER above both projects, so neither can opt out.</text><text x="40" y="458" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">Creating a firewall policy and attaching it are different roles, and xpnAdmin cannot be scoped to a folder.</text></svg>