<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-label="The organization's assets feed two destinations. A feed publishes change notifications to a Pub/Sub topic. A snapshot export writes the full inventory to BigQuery, where the audit runs as SQL. Both destinations are written by Google's Cloud Asset service agent, not by the caller."><defs>
