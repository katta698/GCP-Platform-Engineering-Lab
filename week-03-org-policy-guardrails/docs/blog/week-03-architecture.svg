 fill="#1A73E8"/><text x="630" y="260" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text><text x="40" y="400" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">1   A policy set at the organization applies to everything beneath it. An exception is set lower down, on one folder.</text><text x="40" y="419" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">2   Dry-run violations are written to the PROJECT log, not the organization's. Querying the org stream returns</text><text x="40" y="438" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">     empty with no error, which reads exactly like no violations, and is the reason to look at the project first.</text></svg>