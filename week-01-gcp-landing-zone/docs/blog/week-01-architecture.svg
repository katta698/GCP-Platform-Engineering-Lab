e" stroke="#5F6368" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ar)"/><circle cx="233" cy="215" r="10" fill="#1A73E8"/><text x="233" y="219" class="alabel" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text><text x="40" y="546" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">1   Terraform runs outside Google Cloud and creates the hierarchy. Nothing pre-exists inside the organization.</text><text x="40" y="565" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">Each project enables only the APIs it needs, and auto_create_network is off, so no default network is ever made.</text><text x="40" y="584" font-family="'DM Sans','Google Sans',Roboto,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5F6368" text-anchor="start">The workloads folder holds the environments; the platform folder holds what every environment depends on.</text></svg>